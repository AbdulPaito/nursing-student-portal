<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nursing Student Portal - Navbar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#1E90FF',
              dark: '#1873CC',
              light: '#4da3ff',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-down': 'slideDown 0.3s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideDown: {
              '0%': { opacity: '0', transform: 'translateY(-10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .nav-link {
      position: relative;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #1E90FF, #4da3ff);
      transition: width 0.3s ease;
    }
    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }
    .mobile-menu {
      transition: all 0.3s ease-in-out;
    }
    .hamburger-line {
      transition: all 0.3s ease-in-out;
    }
    .hamburger-active .hamburger-line:first-child {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger-active .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    .hamburger-active .hamburger-line:last-child {
      transform: rotate(-45deg) translate(5px, -5px);
    }
  </style>
</head>
<body class="bg-gray-50">

  <!-- ============================================
       MODERN RESPONSIVE NAVBAR - START
       ============================================ -->
  
  <nav class="bg-white/95 backdrop-blur-md border-b border-gray-200/80 sticky top-0 z-50 transition-all duration-300" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 lg:h-18">
        
        <!-- Logo & Title Section - ALWAYS VISIBLE -->
        <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
          <!-- Logo Container -->
          <a href="/" class="relative group flex items-center justify-center">
            <div class="relative h-10 w-10 sm:h-11 sm:w-11 rounded-xl overflow-hidden bg-gradient-to-br from-primary to-primary-dark shadow-md group-hover:shadow-lg group-hover:shadow-primary/20 transition-all duration-300 group-hover:scale-105">
              <!-- Fallback Icon when logo fails to load -->
              <div class="absolute inset-0 flex items-center justify-center">
                <i class="bi bi-building text-white text-lg sm:text-xl"></i>
              </div>
              <!-- Actual Logo Image -->
              <img 
                src="images/msu-logo.png" 
                alt="MArSU Logo" 
                class="h-full w-full object-contain relative z-10"
                onerror="this.style.display='none'"
              >
            </div>
            <!-- Glow Effect -->
            <div class="absolute -inset-1 bg-primary/20 rounded-xl blur-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </a>
          
          <!-- Title - VISIBLE ON ALL SCREENS -->
          <div class="flex flex-col min-w-0">
            <!-- Main Title - Responsive text scaling -->
            <a href="/" class="group">
              <h1 class="text-sm sm:text-base lg:text-lg font-bold text-gray-900 tracking-tight leading-tight truncate max-w-[140px] sm:max-w-[200px] lg:max-w-none transition-colors duration-300 group-hover:text-primary">
                <span class="hidden sm:inline">Nursing Portal</span>
                <span class="sm:hidden">Nursing</span>
              </h1>
            </a>
            <!-- Subtitle - Hidden on very small screens, visible on sm+ -->
            <span class="hidden sm:block text-[10px] sm:text-xs text-gray-500 font-medium tracking-wide uppercase truncate max-w-[180px] lg:max-w-none">
              Marinduque State University
            </span>
          </div>
        </div>

        <!-- Desktop Navigation Links - Hidden on Mobile -->
        <div class="hidden md:flex items-center gap-1">
          <a 
            href="/" 
            class="nav-link px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary transition-colors duration-200 rounded-lg hover:bg-gray-50/80"
            data-page="home"
          >
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-house text-sm"></i>
              Home
            </span>
          </a>
          <a 
            href="/events" 
            class="nav-link px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary transition-colors duration-200 rounded-lg hover:bg-gray-50/80"
            data-page="events"
          >
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-calendar-days text-sm"></i>
              Events
            </span>
          </a>
          <a 
            href="/daily-subjects.html" 
            class="nav-link px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary transition-colors duration-200 rounded-lg hover:bg-gray-50/80"
            data-page="subjects"
          >
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-book-open text-sm"></i>
              Courses & Subjects
            </span>
          </a>
          <a 
            href="/department-info.html" 
            class="nav-link px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary transition-colors duration-200 rounded-lg hover:bg-gray-50/80"
            data-page="department-info"
          >
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-file-lines text-sm"></i>
              Department Info
            </span>
          </a>
          <a 
            href="/announcements.html" 
            class="nav-link px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary transition-colors duration-200 rounded-lg hover:bg-gray-50/80"
            data-page="announcements"
          >
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-bullhorn text-sm"></i>
              Announcements
            </span>
          </a>
          <a 
            href="#about" 
            class="nav-link px-3 py-2 text-sm font-medium text-gray-700 hover:text-primary transition-colors duration-200 rounded-lg hover:bg-gray-50/80"
            data-page="about"
          >
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-circle-info text-sm"></i>
              Contact
            </span>
          </a>
        </div>

        <!-- Mobile Menu Button - Visible on Mobile Only -->
        <button 
          type="button" 
          class="md:hidden relative p-2 rounded-xl text-gray-600 hover:text-primary hover:bg-gray-100/80 active:scale-95 transition-all duration-200"
          id="mobileMenuBtn"
          aria-label="Toggle menu"
          aria-expanded="false"
        >
          <div class="w-6 h-5 flex flex-col justify-between" id="hamburger">
            <span class="hamburger-line w-full h-0.5 bg-current rounded-full origin-center"></span>
            <span class="hamburger-line w-full h-0.5 bg-current rounded-full"></span>
            <span class="hamburger-line w-full h-0.5 bg-current rounded-full origin-center"></span>
          </div>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Menu - Slide Down Animation -->
    <div 
      class="md:hidden hidden bg-white border-t border-gray-100 shadow-lg shadow-gray-200/50 mobile-menu"
      id="mobileMenu"
    >
      <div class="px-4 py-3 space-y-1">
        <a 
          href="/" 
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 hover:text-primary hover:bg-primary/5 rounded-xl transition-all duration-200"
          data-page="home"
        >
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <i class="fa-solid fa-house text-primary"></i>
          </div>
          <span>Home</span>
        </a>
        <a 
          href="/events" 
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 hover:text-primary hover:bg-primary/5 rounded-xl transition-all duration-200"
          data-page="events"
        >
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <i class="fa-solid fa-calendar-days text-primary"></i>
          </div>
          <span>Events</span>
        </a>
        <a 
          href="/daily-subjects.html" 
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 hover:text-primary hover:bg-primary/5 rounded-xl transition-all duration-200"
          data-page="subjects"
        >
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <i class="fa-solid fa-book-open text-primary"></i>
          </div>
          <span>Courses & Subjects</span>
        </a>
        <a 
          href="/department-info.html" 
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 hover:text-primary hover:bg-primary/5 rounded-xl transition-all duration-200"
          data-page="department-info"
        >
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <i class="fa-solid fa-file-lines text-primary"></i>
          </div>
          <span>Department Info</span>
        </a>
        <a 
          href="/announcements.html" 
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 hover:text-primary hover:bg-primary/5 rounded-xl transition-all duration-200"
          data-page="announcements"
        >
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <i class="fa-solid fa-bullhorn text-primary"></i>
          </div>
          <span>Announcements</span>
        </a>
        <div class="border-t border-gray-100 my-2"></div>
        <a 
          href="#about" 
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-700 hover:text-primary hover:bg-primary/5 rounded-xl transition-all duration-200"
          data-page="about"
        >
          <div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center">
            <i class="fa-solid fa-circle-info text-primary"></i>
          </div>
          <span>Contact Us</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- ============================================
       MODERN RESPONSIVE NAVBAR - END
       ============================================ -->

  <!-- Navbar JavaScript -->
  <script>
    (function() {
      // Mobile menu toggle
      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      const hamburger = document.getElementById('hamburger');
      let isMenuOpen = false;

      function toggleMenu() {
        isMenuOpen = !isMenuOpen;
        
        if (isMenuOpen) {
          mobileMenu.classList.remove('hidden');
          mobileMenu.classList.add('animate-slide-down');
          hamburger.classList.add('hamburger-active');
          mobileMenuBtn.setAttribute('aria-expanded', 'true');
        } else {
          mobileMenu.classList.add('hidden');
          mobileMenu.classList.remove('animate-slide-down');
          hamburger.classList.remove('hamburger-active');
          mobileMenuBtn.setAttribute('aria-expanded', 'false');
        }
      }

      mobileMenuBtn.addEventListener('click', toggleMenu);

      // Close menu when clicking on a link
      const mobileLinks = mobileMenu.querySelectorAll('a');
      mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
          if (isMenuOpen) toggleMenu();
        });
      });

      // Close menu when clicking outside
      document.addEventListener('click', (e) => {
        if (isMenuOpen && !mobileMenu.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
          toggleMenu();
        }
      });

      // Active page highlighting
      const currentPage = window.location.pathname;
      const allLinks = document.querySelectorAll('[data-page]');
      
      allLinks.forEach(link => {
        const page = link.getAttribute('data-page');
        let isActive = false;
        
        if (page === 'home' && (currentPage === '/' || currentPage === '/index.html')) {
          isActive = true;
        } else if (page === 'events' && currentPage.includes('events')) {
          isActive = true;
        } else if (page === 'subjects' && currentPage.includes('daily-subjects')) {
          isActive = true;
        } else if (page === 'department-info' && currentPage.includes('department-info')) {
          isActive = true;
        } else if (page === 'announcements' && currentPage.includes('announcements')) {
          isActive = true;
        } else if (page === 'about' && currentPage.includes('about')) {
          isActive = true;
        }
        
        if (isActive) {
          link.classList.add('active', 'text-primary');
          if (link.classList.contains('nav-link')) {
            link.classList.add('bg-primary/10');
          }
        }
      });

      // Navbar scroll effect - adds shadow on scroll
      const navbar = document.getElementById('navbar');
      let lastScrollY = window.scrollY;

      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        
        if (currentScrollY > 10) {
          navbar.classList.add('shadow-md');
        } else {
          navbar.classList.remove('shadow-md');
        }
        
        lastScrollY = currentScrollY;
      }, { passive: true });
    })();
  </script>

</body>
</html>
