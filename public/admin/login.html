<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Nursing Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#7c3aed',
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            secondary: {
              DEFAULT: '#4f46e5',
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          animation: {
            'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
            'fade-in-up': 'fadeInUp 0.6s ease-out',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            shake: {
              '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
              '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
              '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
              '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 20px rgba(124, 58, 237, 0.4)' },
              '100%': { boxShadow: '0 0 40px rgba(124, 58, 237, 0.8), 0 0 60px rgba(79, 70, 229, 0.6)' },
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    /* Glassmorphism card */
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    /* Gradient background animation */
    .animated-gradient {
      background: linear-gradient(-45deg, #7c3aed, #4f46e5, #7c3aed, #312e81);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Floating shapes */
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
    }
    
    .shape-1 {
      width: 400px;
      height: 400px;
      background: rgba(124, 58, 237, 0.4);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }
    
    .shape-2 {
      width: 300px;
      height: 300px;
      background: rgba(79, 70, 229, 0.4);
      bottom: -50px;
      right: -50px;
      animation-delay: -4s;
    }
    
    /* Input focus animation */
    .input-animated {
      transition: all 0.3s ease;
    }
    
    .input-animated:focus {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -10px rgba(124, 58, 237, 0.3);
    }
    
    /* Button shimmer effect */
    .btn-shimmer {
      position: relative;
      overflow: hidden;
    }
    
    .btn-shimmer::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s;
    }
    
    .btn-shimmer:hover::before {
      left: 100%;
    }
    
    /* Loading spinner */
    .spinner-ring {
      display: inline-block;
      position: relative;
      width: 20px;
      height: 20px;
    }
    
    .spinner-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 16px;
      height: 16px;
      margin: 2px;
      border: 2px solid #fff;
      border-radius: 50%;
      animation: spinner-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #fff transparent transparent transparent;
    }
    
    .spinner-ring div:nth-child(1) { animation-delay: -0.45s; }
    .spinner-ring div:nth-child(2) { animation-delay: -0.3s; }
    .spinner-ring div:nth-child(3) { animation-delay: -0.15s; }
    
    @keyframes spinner-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Logo pulse glow */
    .logo-glow {
      animation: logoGlow 3s ease-in-out infinite;
    }
    
    @keyframes logoGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(124, 58, 237, 0.4); }
      50% { box-shadow: 0 0 50px rgba(124, 58, 237, 0.8), 0 0 70px rgba(79, 70, 229, 0.4); }
    }
  </style>
</head>
<body class="min-h-screen animated-gradient flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Animated Background Shapes -->
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  
  <!-- Grid Pattern Overlay -->
  <div class="fixed inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px;"></div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md animate-fade-in-up">
    <div class="glass-card rounded-3xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="relative p-8 text-center bg-gradient-to-br from-primary-600/90 via-primary-700/90 to-secondary-800/90 backdrop-blur-xl">
        <!-- Animated Logo Container -->
        <div class="relative mx-auto mb-6">
          <div class="w-28 h-28 mx-auto rounded-3xl bg-white/20 flex items-center justify-center logo-glow transform hover:scale-110 transition-transform duration-300 p-2">
            <img src="../images/msu-logo.png" alt="Marinduque State University" class="w-24 h-24 object-contain" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fa-solid fa-building-columns text-5xl text-white\\'></i>';">
          </div>
          <!-- Floating badge -->
          <div class="absolute -bottom-2 -right-2 w-10 h-10 rounded-xl bg-white/30 backdrop-blur-md flex items-center justify-center animate-float">
            <i class="fa-solid fa-shield-halved text-white text-lg"></i>
          </div>
        </div>
        
        <h1 class="text-xl font-bold text-white mb-1 tracking-tight">MARINDUQUE STATE UNIVERSITY</h1>
        <p class="text-white/90 text-sm font-medium mb-1">College of Allied Health Sciences</p>
        <p class="text-white/70 text-xs">Admin Portal</p>
        
        <!-- Decorative line -->
        <div class="mt-6 mx-auto w-20 h-1 rounded-full bg-gradient-to-r from-transparent via-white/50 to-transparent"></div>
      </div>

      <!-- Form -->
      <div class="p-8 bg-white">
        <form id="loginForm" novalidate>
          <!-- Email Field -->
          <div class="mb-5">
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
              Email Address <span class="text-primary-500">*</span>
            </label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fa-regular fa-envelope text-gray-400 group-focus-within:text-primary-500 transition-colors"></i>
              </div>
              <input 
                type="email" 
                id="email" 
                required 
                placeholder="admin@nursing.edu" 
                autocomplete="email"
                class="input-animated w-full pl-11 pr-4 py-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-700 placeholder-gray-400 focus:border-primary-500 focus:bg-white focus:outline-none transition-all"
              >
            </div>
            <p class="text-red-500 text-xs mt-1.5 hidden flex items-center gap-1" id="emailError">
              <i class="fa-solid fa-circle-exclamation text-xs"></i>
              <span>Please enter your email address.</span>
            </p>
          </div>

          <!-- Password Field -->
          <div class="mb-6">
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
              Password <span class="text-primary-500">*</span>
            </label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fa-solid fa-lock text-gray-400 group-focus-within:text-primary-500 transition-colors"></i>
              </div>
              <input 
                type="password" 
                id="password" 
                required 
                placeholder="••••••••" 
                autocomplete="current-password"
                class="input-animated w-full pl-11 pr-12 py-3.5 bg-gray-50 border-2 border-gray-200 rounded-xl text-gray-700 placeholder-gray-400 focus:border-primary-500 focus:bg-white focus:outline-none transition-all"
              >
              <button 
                type="button" 
                id="passwordToggle"
                class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-primary-500 transition-colors focus:outline-none"
                aria-label="Toggle password visibility"
              >
                <i class="fa-regular fa-eye" id="passwordIcon"></i>
              </button>
            </div>
            <p class="text-red-500 text-xs mt-1.5 hidden flex items-center gap-1" id="passwordError">
              <i class="fa-solid fa-circle-exclamation text-xs"></i>
              <span>Please enter your password.</span>
            </p>
          </div>

          <!-- Error Alert -->
          <div id="loginError" class="hidden mb-5 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-xl">
            <div class="flex items-center gap-3 text-red-600">
              <i class="fa-solid fa-triangle-exclamation text-lg"></i>
              <span class="text-sm font-medium" id="errorText">Login failed.</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            id="loginBtn"
            class="btn-shimmer w-full bg-gradient-to-r from-primary-600 to-secondary-600 hover:from-primary-700 hover:to-secondary-700 text-white font-semibold py-4 rounded-xl transition-all duration-300 hover:shadow-xl hover:shadow-primary-500/30 hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2 group"
          >
            <span class="group-hover:scale-105 transition-transform">Sign In</span>
            <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
          </button>
        </form>

        <!-- Back Link -->
        <div class="mt-6 text-center">
          <a href="/" class="text-sm text-gray-500 hover:text-primary-600 transition-colors flex items-center justify-center gap-2 group">
            <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
            <span>Back to Student Portal</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-white/70 text-xs mt-6 font-medium">
      © 2025 Nursing Student Portal. All rights reserved.
    </p>
  </div>

  <script>
    (function() {
      // Check if already logged in
      if (localStorage.getItem('adminToken')) { 
        window.location.href = '/admin'; 
        return; 
      }

      const form = document.getElementById('loginForm');
      const emailEl = document.getElementById('email');
      const passwordEl = document.getElementById('password');
      const errEl = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      const btn = document.getElementById('loginBtn');
      const toggleBtn = document.getElementById('passwordToggle');
      const passwordIcon = document.getElementById('passwordIcon');

      // Password visibility toggle
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordEl.type === 'password';
        passwordEl.type = isPassword ? 'text' : 'password';
        passwordIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      });

      function showFieldError(el, msg) {
        el.classList.add('border-red-500', 'bg-red-50');
        el.classList.remove('border-gray-200', 'bg-gray-50');
        const err = el.parentElement.nextElementSibling;
        if (err && err.id.includes('Error')) {
          err.querySelector('span').textContent = msg || 'This field is required.';
          err.classList.remove('hidden');
        }
        el.addEventListener('input', clearFieldError.bind(null, el), { once: true });
      }

      function clearFieldError(el) {
        el.classList.remove('border-red-500', 'bg-red-50');
        el.classList.add('border-gray-200', 'bg-gray-50');
        const err = el.parentElement.nextElementSibling;
        if (err && err.id.includes('Error')) {
          err.classList.add('hidden');
        }
      }

      function clearAllErrors() {
        clearFieldError(emailEl);
        clearFieldError(passwordEl);
        errEl.classList.add('hidden');
      }

      function shakeForm() {
        form.classList.add('animate-shake');
        setTimeout(() => form.classList.remove('animate-shake'), 500);
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAllErrors();

        const email = emailEl.value.trim();
        const password = passwordEl.value;

        let valid = true;
        if (!email) { 
          showFieldError(emailEl, 'Please enter your email address.'); 
          valid = false; 
        }
        if (!password) { 
          showFieldError(passwordEl, 'Please enter your password.'); 
          valid = false; 
        }
        if (!valid) {
          shakeForm();
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner-ring"><div></div><div></div><div></div><div></div></div><span>Signing in...</span>';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
          });
          const data = await res.json();

          if (!res.ok) {
            errorText.textContent = data.error || 'Login failed. Please try again.';
            errEl.classList.remove('hidden');
            shakeForm();
            btn.disabled = false;
            btn.innerHTML = '<span>Sign In</span><i class="fa-solid fa-arrow-right"></i>';
            return;
          }

          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', JSON.stringify(data.admin || data.user));
          
          // Success animation before redirect
          btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Success!</span>';
          btn.classList.remove('from-primary-600', 'to-secondary-600');
          btn.classList.add('from-green-500', 'to-green-600');
          
          setTimeout(() => {
            window.location.href = '/admin';
          }, 500);
        } catch (err) {
          errorText.textContent = 'Network error. Please try again.';
          errEl.classList.remove('hidden');
          shakeForm();
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In</span><i class="fa-solid fa-arrow-right"></i>';
        }
      });
    })();
  </script>
</body>
</html>
