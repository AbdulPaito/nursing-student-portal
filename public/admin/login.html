<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Nursing Student Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#1E90FF',
              dark: '#1873CC',
              light: '#4da3ff',
            },
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          animation: {
            'shake': 'shake 0.5s ease-in-out',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../css/animations.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-slate-200 to-slate-300 flex items-center justify-center p-4">
  <!-- Background Pattern -->
  <div class="fixed inset-0 opacity-30 pointer-events-none">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(30,144,255,0.15)_1px,transparent_0)] bg-[length:24px_24px]"></div>
  </div>

  <!-- Login Card -->
  <div class="relative w-full max-w-md animate-fade-in-up">
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="bg-gradient-to-r from-primary to-primary-dark p-8 text-center">
        <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-white/20 flex items-center justify-center animate-pulse-glow">
          <img src="../images/nursing-logo.png" alt="Nursing Logo" class="w-16 h-16 rounded-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
          <div class="hidden">
            <i class="bi bi-shield-lock text-white text-3xl"></i>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-white mb-1">Nursing Student Portal</h1>
        <p class="text-white/80 text-sm">Program Coordinator Login</p>
      </div>

      <!-- Form -->
      <div class="p-8">
        <form id="loginForm" novalidate>
          <!-- Email Field -->
          <div class="mb-5">
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
              Email Address <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input 
                type="email" 
                id="email" 
                required 
                placeholder="admin@nursing.edu" 
                autocomplete="email"
                class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none"
              >
            </div>
            <p class="text-red-500 text-xs mt-1 hidden" id="emailError">Please enter your email address.</p>
          </div>

          <!-- Password Field -->
          <div class="mb-6">
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
              Password <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input 
                type="password" 
                id="password" 
                required 
                placeholder="••••••••" 
                autocomplete="current-password"
                class="w-full pl-11 pr-12 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none"
              >
              <button 
                type="button" 
                id="passwordToggle"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-primary transition-colors rounded-lg"
                aria-label="Toggle password visibility"
              >
                <i class="bi bi-eye" id="passwordIcon"></i>
              </button>
            </div>
            <p class="text-red-500 text-xs mt-1 hidden" id="passwordError">Please enter your password.</p>
          </div>

          <!-- Error Alert -->
          <div id="loginError" class="hidden mb-5 p-4 bg-red-50 border border-red-200 rounded-xl">
            <div class="flex items-center gap-2 text-red-600">
              <i class="bi bi-exclamation-circle"></i>
              <span class="text-sm font-medium" id="errorText">Login failed.</span>
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            id="loginBtn"
            class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 rounded-xl transition-all duration-300 hover:shadow-lg hover:shadow-primary/30 hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2"
          >
            <span>Sign In</span>
            <i class="bi bi-arrow-right"></i>
          </button>
        </form>

        <!-- Back Link -->
        <div class="mt-6 text-center">
          <a href="/" class="text-sm text-gray-500 hover:text-primary transition-colors flex items-center justify-center gap-1">
            <i class="bi bi-arrow-left"></i>
            Back to Student Portal
          </a>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-500 text-xs mt-6">
      © 2025 Nursing Student Portal. All rights reserved.
    </p>
  </div>

  <script>
    (function() {
      // Check if already logged in
      if (localStorage.getItem('adminToken')) { 
        window.location.href = '/admin'; 
        return; 
      }

      const form = document.getElementById('loginForm');
      const emailEl = document.getElementById('email');
      const passwordEl = document.getElementById('password');
      const errEl = document.getElementById('loginError');
      const errorText = document.getElementById('errorText');
      const btn = document.getElementById('loginBtn');
      const toggleBtn = document.getElementById('passwordToggle');
      const passwordIcon = document.getElementById('passwordIcon');

      // Password visibility toggle
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordEl.type === 'password';
        passwordEl.type = isPassword ? 'text' : 'password';
        passwordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });

      function showFieldError(el, msg) {
        el.classList.add('border-red-500', 'bg-red-50');
        el.classList.remove('border-gray-300');
        const err = el.parentElement.nextElementSibling;
        if (err && err.classList.contains('text-red-500')) {
          err.textContent = msg || 'This field is required.';
          err.classList.remove('hidden');
        }
        el.addEventListener('input', clearFieldError.bind(null, el), { once: true });
      }

      function clearFieldError(el) {
        el.classList.remove('border-red-500', 'bg-red-50');
        el.classList.add('border-gray-300');
        const err = el.parentElement.nextElementSibling;
        if (err && err.classList.contains('text-red-500')) {
          err.classList.add('hidden');
        }
      }

      function clearAllErrors() {
        clearFieldError(emailEl);
        clearFieldError(passwordEl);
        errEl.classList.add('hidden');
      }

      function shakeForm() {
        form.classList.add('animate-shake');
        setTimeout(() => form.classList.remove('animate-shake'), 500);
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAllErrors();

        const email = emailEl.value.trim();
        const password = passwordEl.value;

        let valid = true;
        if (!email) { 
          showFieldError(emailEl, 'Please enter your email address.'); 
          valid = false; 
        }
        if (!password) { 
          showFieldError(passwordEl, 'Please enter your password.'); 
          valid = false; 
        }
        if (!valid) {
          shakeForm();
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner spinner-sm border-white border-t-transparent"></div><span>Signing in...</span>';

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
          });
          const data = await res.json();

          if (!res.ok) {
            errorText.textContent = data.error || 'Login failed. Please try again.';
            errEl.classList.remove('hidden');
            shakeForm();
            btn.disabled = false;
            btn.innerHTML = '<span>Sign In</span><i class="bi bi-arrow-right"></i>';
            return;
          }

          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', JSON.stringify(data.user));
          window.location.href = '/admin';
        } catch (err) {
          errorText.textContent = 'Network error. Please try again.';
          errEl.classList.remove('hidden');
          shakeForm();
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In</span><i class="bi bi-arrow-right"></i>';
        }
      });
    })();
  </script>
</body>
</html>
