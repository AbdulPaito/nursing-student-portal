<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Nursing Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --primary: #1E90FF; }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(180deg, #f0f4f8 0%, #e2e8f0 50%, #cbd5e1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-page { width: 100%; max-width: 400px; }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);
      padding: 2rem;
      border: none;
    }
    .login-header { text-align: center; margin-bottom: 1.75rem; }
    .login-header i { font-size: 2.5rem; color: var(--primary); }
    .login-title { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.5rem; color: #1e293b; margin: 0.75rem 0 0.25rem; }
    .login-subtitle { font-size: 0.9rem; color: #64748b; margin: 0; }
    .form-label { font-weight: 500; color: #334155; }
    .form-control {
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      padding: 0.65rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.15);
    }
    .form-control.is-invalid { border-color: #dc3545; }
    .password-wrap { position: relative; }
    .password-wrap .form-control { padding-right: 2.75rem; }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      padding: 0.25rem;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .password-toggle:hover { color: var(--primary); }
    .btn-login {
      background: var(--primary);
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover:not(:disabled) { background: #1873CC; color: #fff; }
    .btn-login:active:not(:disabled) { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.8; cursor: not-allowed; }
    .alert-danger { border-radius: 10px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card card">
      <div class="login-header">
        <img src="../images/nursing-logo.png" alt="Nursing Logo" style="height:72px;width:72px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none';">
        <h1 class="login-title">Nursing Student Portal</h1>
        <p class="login-subtitle">Program Coordinator Login</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
          <input type="email" class="form-control" id="email" required placeholder="admin@nursing.edu" autocomplete="email">
          <div class="invalid-feedback" id="emailError">Please enter your email address.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="passwordIcon"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="passwordError">Please enter your password.</div>
        </div>
        <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button type="submit" class="btn btn-login" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
  <script>
    (function() {
      if (localStorage.getItem('adminToken')) { window.location.href = '/admin'; return; }

      var form = document.getElementById('loginForm');
      var emailEl = document.getElementById('email');
      var passwordEl = document.getElementById('password');
      var errEl = document.getElementById('loginError');
      var btn = document.getElementById('loginBtn');
      var toggleBtn = document.getElementById('passwordToggle');
      var passwordIcon = document.getElementById('passwordIcon');

      // Password visibility toggle
      toggleBtn.addEventListener('click', function() {
        var isPassword = passwordEl.type === 'password';
        passwordEl.type = isPassword ? 'text' : 'password';
        passwordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
      });

      function showFieldError(el, msg) {
        el.classList.add('is-invalid');
        var err = el.nextElementSibling;
        if (err && err.classList.contains('invalid-feedback')) err.textContent = msg || 'This field is required.';
      }
      function clearFieldError(el) {
        el.classList.remove('is-invalid');
      }
      function clearAllErrors() {
        clearFieldError(emailEl);
        clearFieldError(passwordEl);
        errEl.classList.add('d-none');
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAllErrors();

        var email = emailEl.value.trim();
        var password = passwordEl.value;

        var valid = true;
        if (!email) { showFieldError(emailEl); valid = false; }
        if (!password) { showFieldError(passwordEl); valid = false; }
        if (!valid) return;

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Signing in...';

        try {
          var res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
          });
          var data = await res.json();

          if (!res.ok) {
            errEl.textContent = data.error || 'Login failed. Please try again.';
            errEl.classList.remove('d-none');
            btn.disabled = false;
            btn.textContent = 'Sign In';
            return;
          }

          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', JSON.stringify(data.user));
          window.location.href = '/admin';
        } catch (err) {
          errEl.textContent = 'Network error. Please try again.';
          errEl.classList.remove('d-none');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
