<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Management - Admin Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            secondary: {
              600: '#4f46e5',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 50%, #e0e7ff 100%);
      min-height: 100vh;
    }
    
    /* Animated Background Pattern */
    .bg-pattern {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(79, 70, 229, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
      pointer-events: none;
      z-index: -1;
    }
    
    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <!-- Main Container -->
  <div class="min-h-screen p-4 sm:p-6 lg:p-8">
    
    <!-- Header -->
    <div class="max-w-7xl mx-auto mb-8">
      <div class="glass rounded-2xl shadow-xl p-6">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-primary-600 to-secondary-600 text-white hover:scale-105 transition-transform">
              <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div>
              <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Music Management</h1>
              <p class="text-sm text-gray-600">Manage background music for login and portal pages</p>
            </div>
          </div>
          <button onclick="openUploadModal()" class="px-6 py-3 bg-gradient-to-br from-primary-600 to-secondary-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all flex items-center gap-2">
            <i class="fa-solid fa-upload"></i>
            Upload Music
          </button>
        </div>
      </div>
    </div>

    <!-- Music List -->
    <div class="max-w-7xl mx-auto">
      <div class="glass rounded-2xl shadow-xl p-6">
        <div class="mb-6">
          <h2 class="text-xl font-bold text-gray-800 mb-2">Uploaded Music Files</h2>
          <p class="text-sm text-gray-600">Click to play, toggle active status, or delete music files</p>
        </div>
        
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-12">
          <i class="fa-solid fa-spinner fa-spin text-4xl text-primary-600 mb-4"></i>
          <p class="text-gray-600">Loading music files...</p>
        </div>
        
        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
          <i class="fa-solid fa-music text-6xl text-gray-300 mb-4"></i>
          <p class="text-gray-600 mb-4">No music files uploaded yet</p>
          <button onclick="openUploadModal()" class="px-6 py-3 bg-gradient-to-br from-primary-600 to-secondary-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
            Upload Your First Music
          </button>
        </div>
        
        <!-- Music Grid -->
        <div id="musicGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 animate-fade-in-up">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-bold text-gray-800">Upload Music</h3>
        <button onclick="closeUploadModal()" class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-times text-gray-600"></i>
        </button>
      </div>
      
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Music Title</label>
          <input type="text" id="musicTitle" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all" placeholder="Enter music title">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Location</label>
          <select id="musicLocation" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all">
            <option value="login">Login Page Only</option>
            <option value="portal">Student Portal Only</option>
            <option value="both">Both Pages</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Music File</label>
          <div class="relative">
            <input type="file" id="musicFile" accept="audio/*" required class="hidden" onchange="updateFileName()">
            <button type="button" onclick="document.getElementById('musicFile').click()" class="w-full px-4 py-3 rounded-xl border-2 border-dashed border-gray-300 hover:border-primary-500 text-gray-600 hover:text-primary-600 transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-file-audio"></i>
              <span id="fileNameDisplay">Choose audio file (MP3, WAV, OGG, M4A)</span>
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-2">Maximum file size: 10MB</p>
        </div>
        
        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeUploadModal()" class="flex-1 px-6 py-3 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-all">
            Cancel
          </button>
          <button type="submit" id="uploadBtn" class="flex-1 px-6 py-3 bg-gradient-to-br from-primary-600 to-secondary-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
            Upload
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-2xl font-bold text-gray-800">Edit Music</h3>
        <button onclick="closeEditModal()" class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-times text-gray-600"></i>
        </button>
      </div>
      
      <form id="editForm" class="space-y-4">
        <input type="hidden" id="editMusicId">
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Music Title</label>
          <input type="text" id="editMusicTitle" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all">
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Location</label>
          <select id="editMusicLocation" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all">
            <option value="login">Login Page Only</option>
            <option value="portal">Student Portal Only</option>
            <option value="both">Both Pages</option>
          </select>
        </div>
        
        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeEditModal()" class="flex-1 px-6 py-3 bg-gray-100 text-gray-700 rounded-xl font-semibold hover:bg-gray-200 transition-all">
            Cancel
          </button>
          <button type="submit" class="flex-1 px-6 py-3 bg-gradient-to-br from-primary-600 to-secondary-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
            Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    // Load music files on page load
    document.addEventListener('DOMContentLoaded', loadMusicFiles);

    async function loadMusicFiles() {
      try {
        const token = localStorage.getItem('token');
        if (!token) {
          window.location.href = 'login.html';
          return;
        }

        const response = await fetch('/api/music', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        document.getElementById('loadingState').classList.add('hidden');

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
            return;
          }
          throw new Error(data.message || 'Failed to load music files');
        }

        if (data.length === 0) {
          document.getElementById('emptyState').classList.remove('hidden');
        } else {
          displayMusicFiles(data);
        }
      } catch (error) {
        console.error('Load music error:', error);
        document.getElementById('loadingState').innerHTML = `
          <i class="fa-solid fa-exclamation-circle text-4xl text-red-500 mb-4"></i>
          <p class="text-red-600">${error.message}</p>
        `;
      }
    }

    function displayMusicFiles(musicFiles) {
      const grid = document.getElementById('musicGrid');
      grid.innerHTML = musicFiles.map(music => `
        <div class="bg-white rounded-xl border-2 border-gray-200 p-5 hover:border-primary-500 hover:shadow-lg transition-all">
          <div class="flex items-start justify-between mb-4">
            <div class="flex-1">
              <h3 class="font-bold text-gray-800 mb-1">${music.title}</h3>
              <p class="text-xs text-gray-500">${formatFileSize(music.fileSize)}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-semibold ${music.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">
              ${music.isActive ? 'Active' : 'Inactive'}
            </span>
          </div>
          
          <div class="mb-4">
            <span class="inline-flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-medium bg-primary-50 text-primary-700">
              <i class="fa-solid fa-map-marker-alt"></i>
              ${getLocationLabel(music.location)}
            </span>
          </div>
          
          <audio controls class="w-full mb-4" style="height: 40px;">
            <source src="${music.filePath}" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
          
          <div class="flex gap-2">
            <button onclick="toggleMusicStatus('${music._id}', ${music.isActive})" class="flex-1 px-4 py-2 rounded-lg font-medium transition-all ${music.isActive ? 'bg-gray-100 text-gray-700 hover:bg-gray-200' : 'bg-green-100 text-green-700 hover:bg-green-200'}">
              <i class="fa-solid fa-${music.isActive ? 'pause' : 'play'}"></i>
              ${music.isActive ? 'Deactivate' : 'Activate'}
            </button>
            <button onclick="openEditModal('${music._id}', '${music.title}', '${music.location}')" class="px-4 py-2 rounded-lg font-medium bg-blue-100 text-blue-700 hover:bg-blue-200 transition-all">
              <i class="fa-solid fa-edit"></i>
            </button>
            <button onclick="deleteMusic('${music._id}')" class="px-4 py-2 rounded-lg font-medium bg-red-100 text-red-700 hover:bg-red-200 transition-all">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function getLocationLabel(location) {
      const labels = {
        'login': 'Login Page',
        'portal': 'Student Portal',
        'both': 'Both Pages'
      };
      return labels[location] || location;
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function openUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
      document.getElementById('uploadForm').reset();
      document.getElementById('fileNameDisplay').textContent = 'Choose audio file (MP3, WAV, OGG, M4A)';
    }

    function updateFileName() {
      const fileInput = document.getElementById('musicFile');
      const display = document.getElementById('fileNameDisplay');
      if (fileInput.files.length > 0) {
        display.textContent = fileInput.files[0].name;
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('musicTitle').value;
      const location = document.getElementById('musicLocation').value;
      const file = document.getElementById('musicFile').files[0];

      if (!file) {
        alert('Please select a music file');
        return;
      }

      const formData = new FormData();
      formData.append('title', title);
      formData.append('location', location);
      formData.append('music', file);

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';

      try {
        const token = localStorage.getItem('token');
        const response = await fetch('/api/music/upload', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Upload failed');
        }

        alert('Music uploaded successfully!');
        closeUploadModal();
        location.reload();
      } catch (error) {
        console.error('Upload error:', error);
        alert('Error: ' + error.message);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = 'Upload';
      }
    });

    async function toggleMusicStatus(id, currentStatus) {
      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`/api/music/${id}/toggle`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Failed to update status');
        }

        alert(data.message);
        location.reload();
      } catch (error) {
        console.error('Toggle error:', error);
        alert('Error: ' + error.message);
      }
    }

    async function deleteMusic(id) {
      if (!confirm('Are you sure you want to delete this music file?')) {
        return;
      }

      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`/api/music/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Delete failed');
        }

        alert('Music deleted successfully!');
        location.reload();
      } catch (error) {
        console.error('Delete error:', error);
        alert('Error: ' + error.message);
      }
    }

    function openEditModal(id, title, location) {
      document.getElementById('editMusicId').value = id;
      document.getElementById('editMusicTitle').value = title;
      document.getElementById('editMusicLocation').value = location;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('editMusicId').value;
      const title = document.getElementById('editMusicTitle').value;
      const location = document.getElementById('editMusicLocation').value;

      try {
        const token = localStorage.getItem('token');
        const response = await fetch(`/api/music/${id}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title, location })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Update failed');
        }

        alert('Music updated successfully!');
        closeEditModal();
        location.reload();
      } catch (error) {
        console.error('Update error:', error);
        alert('Error: ' + error.message);
      }
    });
  </script>
</body>
</html>
